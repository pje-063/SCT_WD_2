<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeSync - Modern Stopwatch</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stopwatch-card">
        <!-- Header Section -->
        <div class="logo-badge">
            <i class="fa-solid fa-stopwatch"></i>
        </div>
        <h1 class="app-title">TimeSync</h1>
        <p class="app-subtitle">Track Every Second with Precision</p>

        <!-- Status Indicator -->
        <div class="status-indicator">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Ready</span>
        </div>

        <!-- Timer Display Box -->
        <div class="timer-box">
            <span id="display">00:00:00.00</span>
        </div>

        <!-- Control Buttons Grid -->
        <div class="controls-grid">
            <button id="startBtn" class="btn btn-emerald">
                <i class="fa-solid fa-play"></i> Start
            </button>
            <button id="pauseBtn" class="btn btn-dark" disabled>
                <i class="fa-solid fa-pause"></i> Pause
            </button>
            <button id="resetBtn" class="btn btn-dark">
                <i class="fa-solid fa-rotate-left"></i> Reset
            </button>
            <button id="lapBtn" class="btn btn-emerald" disabled>
                <i class="fa-solid fa-flag"></i> Lap
            </button>
        </div>

        <!-- Lap Records Section -->
        <div class="laps-section">
            <div class="laps-header">
                <i class="fa-solid fa-list-ul"></i>
                <span>Lap Records</span>
            </div>
            <ul id="lapsList" class="laps-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
